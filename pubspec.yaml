name: student_task_manager
description: A Student Task Manager application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.18.1
  path_provider: ^2.1.0
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^15.1.1
  uuid: ^4.3.3
  firebase_core:
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true